- aid: seldon:seldon-drift-detection-api
  name: Seldon Drift Detection API
  description: >
    Seldon integrates Alibi-Detect drift detection models that can be deployed as standard Seldon models,
    providing REST endpoints for monitoring incoming request distribution against reference training data
    distributions. Drift detectors are configured and managed via the Seldon Core 2 deployment API and
    expose detection results through standard inference endpoints.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.seldon.ai/seldon-core-2/user-guide/data-science-monitoring/drift
  baseURL: https://docs.seldon.ai
  tags:
  - Drift Detection
  - Monitoring
  - Alibi-Detect
  properties:
  - type: Documentation
    url: https://docs.seldon.ai/seldon-core-2/user-guide/data-science-monitoring/drift
- aid: seldon:seldon-explainability-api
  name: Seldon Explainability API
  description: >
    Seldon provides a dedicated /explain REST endpoint alongside each deployed model, powered by the Alibi
    explainability library. The endpoint supports multiple explanation algorithms including SHAP, integrated
    gradients, and anchor-based methods, allowing users to request human-interpretable explanations for
    individual model predictions in production.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.seldon.io/projects/seldon-core/en/latest/analytics/drift_detection.html
  baseURL: https://docs.seldon.io
  tags:
  - Explainability
  - SHAP
