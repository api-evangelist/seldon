            TODO: Add other useful fields. apiVersion, kind, uid?

            +optional'
          type: string
        optional:
          description: 'Specify whether the Secret must be defined

            +optional'
          type: boolean
      title: 'SecretEnvSource selects a Secret to populate the environment

        variables with.'
      type: object
    SecurityContext:
      description: 'Some fields are present in both SecurityContext and PodSecurityContext.  When both

        are set, the values in SecurityContext take precedence.'
      properties:
        allowPrivilegeEscalation:
          description: 'AllowPrivilegeEscalation controls whether a process can gain more

            privileges than its parent process. This bool directly controls if

            the no_new_privs flag will be set on the container process.

            AllowPrivilegeEscalation is true always when the container is:

            1) run as Privileged

            2) has CAP_SYS_ADMIN

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        privileged:
          description: 'Run container in privileged mode.

            Processes in privileged containers are essentially equivalent to root on the host.

            Defaults to false.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
          type: boolean
        procMount:
          $ref: '#/components/schemas/ProcMountType'
        readOnlyRootFilesystem:
          description: 'Whether this container has a read-only root filesystem.

            Default is false.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
          type: boolean
        runAsGroup:
          description: 'The GID to run the entrypoint of the container process.

            Uses runtime default if unset.

            May also be set in PodSecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
          format: int64
          type: integer
        runAsNonRoot:
          description: 'Indicates that the container must run as a non-root user.

            If true, the Kubelet will validate the image at runtime to ensure that it

            does not run as UID 0 (root) and fail to start the container if it does.

            If unset or false, no such validation will be performed.

            May also be set in PodSecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            +optional'
          type: boolean
        runAsUser:
          description: 'The UID to run the entrypoint of the container process.

            Defaults to user specified in image metadata if unspecified.

            May also be set in PodSecurityContext.  If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            Note that this field cannot be set when spec.os.name is windows.

            +optional'
          format: int64
          type: integer
        seLinuxOptions:
          $ref: '#/components/schemas/SELinuxOptions'
        seccompProfile:
          $ref: '#/components/schemas/SeccompProfile'
        windowsOptions:
          $ref: '#/components/schemas/WindowsSecurityContextOptions'
      title: SecurityContext holds security configuration that will be applied to a container.
      type: object
    RollingUpdateDeployment:
      properties:
        maxSurge:
          $ref: '#/components/schemas/IntOrString'
        maxUnavailable:
          $ref: '#/components/schemas/IntOrString'
      title: Spec to control the desired behavior of rolling update.
      type: object
    ContainerState:
      description: 'Only one of its members may be specified.

        If none of them is specified, the default one is ContainerStateWaiting.'
      properties:
        running:
          $ref: '#/components/schemas/ContainerStateRunning'
        terminated:
          $ref: '#/components/schemas/ContainerStateTerminated'
        waiting:
          $ref: '#/components/schemas/ContainerStateWaiting'
      title: ContainerState holds a possible state of container.
      type: object
    PodResizeStatus:
      title: PodResizeStatus shows status of desired resize of a pod's containers.
      type: string
    ScaleIOVolumeSource:
      description: ScaleIOVolumeSource represents a persistent ScaleIO volume
      properties:
        fsType:
          description: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs".

            Default is "xfs".

            +optional'
          type: string
        gateway:
          description: gateway is the host address of the ScaleIO API Gateway.
          type: string
        protectionDomain:
          description: 'protectionDomain is the name of the ScaleIO Protection Domain for the configured storage.

            +optional'
          type: string
        readOnly:
          description: 'readOnly Defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
          type: boolean
        secretRef:
          $ref: '#/components/schemas/LocalObjectReference'
        sslEnabled:
          description: 'sslEnabled Flag enable/disable SSL communication with Gateway, default false

            +optional'
          type: boolean
        storageMode:
          description: 'storageMode indicates whether the storage for a volume should be ThickProvisioned or ThinProvisioned.

            Default is ThinProvisioned.

            +optional'
          type: string
        storagePool:
          description: 'storagePool is the ScaleIO Storage Pool associated with the protection domain.

            +optional'
          type: string
        system:
          description: system is the name of the storage system as configured in ScaleIO.
          type: string
        volumeName:
          description: 'volumeName is the name of a volume already created in the ScaleIO system

            that is associated with this volume source.'
          type: string
      type: object
    FlockerVolumeSource:
      description: 'One and only one of datasetName and datasetUUID should be set.

        Flocker volumes do not support ownership management or SELinux relabeling.'
      properties:
        datasetName:
          description: 'datasetName is Name of the dataset stored as metadata -> name on the dataset for Flocker

            should be considered as deprecated

            +optional'
          type: string
        datasetUUID:
          description: 'datasetUUID is the UUID of the dataset. This is unique identifier of a Flocker dataset

            +optional'
          type: string
      title: Represents a Flocker volume mounted by the Flocker agent.
      type: object
    NodeSelectorTerm:
      description: 'A null or empty node selector term matches no objects. The requirements of

        them are ANDed.

        The TopologySelectorTerm type implements a subset of the NodeSelectorTerm.

        +structType=atomic'
      properties:
        matchExpressions:
          description: 'A list of node selector requirements by node''s labels.

            +optional'
          items:
            $ref: '#/components/schemas/NodeSelectorRequirement'
          type: array
        matchFields:
          description: 'A list of node selector requirements by node''s fields.

            +optional'
          items:
            $ref: '#/components/schemas/NodeSelectorRequirement'
          type: array
      type: object
    TypedObjectReference:
      properties:
        apiGroup:
          description: 'APIGroup is the group for the resource being referenced.

            If APIGroup is not specified, the specified Kind must be in the core API group.

            For any other third-party types, APIGroup is required.

            +optional'
          type: string
        kind:
          description: Kind is the type of resource being referenced
          type: string
        name:
          description: Name is the name of resource being referenced
          type: string
        namespace:
          description: 'Namespace is the namespace of resource being referenced

            Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace''s owner to accept the reference. See the ReferenceGrant documentation for details.

            (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.

            +featureGate=CrossNamespaceVolumeDataSource

            +optional'
          type: string
      type: object
    IPFamilyPolicy:
      description: 'IPFamilyPolicy represents the dual-stack-ness requested or required by a Service

        +enum'
      type: string
    Container:
      properties:
        args:
          description: 'Arguments to the entrypoint.

            The container image''s CMD is used if this is not provided.

            Variable references $(VAR_NAME) are expanded using the container''s environment. If a variable

            cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced

            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will

            produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless

            of whether the variable exists or not. Cannot be updated.

            More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell

            +optional'
          items:
            type: string
          type: array
        command:
          description: 'Entrypoint array. Not executed within a shell.

            The container image''s ENTRYPOINT is used if this is not provided.

            Variable references $(VAR_NAME) are expanded using the container''s environment. If a variable

            cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced

            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will

            produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless

            of whether the variable exists or not. Cannot be updated.

            More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell

            +optional'
          items:
            type: string
          type: array
        env:
          description: 'List of environment variables to set in the container.

            Cannot be updated.

            +optional

            +patchMergeKey=name

            +patchStrategy=merge'
          items:
            $ref: '#/components/schemas/EnvVar'
          type: array
        envFrom:
          description: 'List of sources to populate environment variables in the container.

            The keys defined within a source must be a C_IDENTIFIER. All invalid keys

            will be reported as an event when the container is starting. When a key exists in multiple

            sources, the value associated with the last source will take precedence.

            Values defined by an Env with a duplicate key will take precedence.

            Cannot be updated.

            +optional'
          items:
            $ref: '#/components/schemas/EnvFromSource'
          type: array
        image:
          description: 'Container image name.

            More info: https://kubernetes.io/docs/concepts/containers/images

            This field is optional to allow higher level config management to default or override

            container images in workload controllers like Deployments and StatefulSets.

            +optional'
          type: string
        imagePullPolicy:
          $ref: '#/components/schemas/PullPolicy'
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
        livenessProbe:
          $ref: '#/components/schemas/Probe'
        name:
          description: 'Name of the container specified as a DNS_LABEL.

            Each container in a pod must have a unique name (DNS_LABEL).

            Cannot be updated.'
          type: string
        ports:
          description: 'List of ports to expose from the container. Not specifying a port here

            DOES NOT prevent that port from being exposed. Any port which is

            listening on the default "0.0.0.0" address inside a container will be

            accessible from the network.

            Modifying this array with strategic merge patch may corrupt the data.

            For more information See https://github.com/kubernetes/kubernetes/issues/108255.

            Cannot be updated.

            +optional

            +patchMergeKey=containerPort

            +patchStrategy=merge

            +listType=map

            +listMapKey=containerPort

            +listMapKey=protocol'
          items:
            $ref: '#/components/schemas/ContainerPort'
          type: array
        readinessProbe:
          $ref: '#/components/schemas/Probe'
        resizePolicy:
          description: 'Resources resize policy for the container.

            +featureGate=InPlacePodVerticalScaling

            +optional

            +listType=atomic'
          items:
            $ref: '#/components/schemas/ContainerResizePolicy'
          type: array
        resources:
          $ref: '#/components/schemas/ResourceRequirements'
        restartPolicy:
          $ref: '#/components/schemas/ContainerRestartPolicy'
        securityContext:
          $ref: '#/components/schemas/SecurityContext'
        startupProbe:
          $ref: '#/components/schemas/Probe'
        stdin:
          description: 'Whether this container should allocate a buffer for stdin in the container runtime. If this

            is not set, reads from stdin in the container will always result in EOF.

            Default is false.

            +optional'
          type: boolean
        stdinOnce:
          description: 'Whether the container runtime should close the stdin channel after it has been opened by

            a single attach. When stdin is true the stdin stream will remain open across multiple attach

            sessions. If stdinOnce is set to true, stdin is opened on container start, is empty until the

            first client attaches to stdin, and then remains open and accepts data until the client disconnects,

            at which time stdin is closed and remains closed until the container is restarted. If this

            flag is false, a container processes that reads from stdin will never receive an EOF.

            Default is false

            +optional'
          type: boolean
        terminationMessagePath:
          description: 'Optional: Path at which the file to which the container''s termination message

            will be written is mounted into the container''s filesystem.

            Message written is intended to be brief final status, such as an assertion failure message.

            Will be truncated by the node if greater than 4096 bytes. The total message length across

            all containers will be limited to 12kb.

            Defaults to /dev/termination-log.

            Cannot be updated.

            +optional'
          type: string
        terminationMessagePolicy:
          $ref: '#/components/schemas/TerminationMessagePolicy'
        tty:
          description: 'Whether this container should allocate a TTY for itself, also requires ''stdin'' to be true.

            Default is false.

            +optional'
          type: boolean
        volumeDevices:
          description: 'volumeDevices is the list of block devices to be used by the container.

            +patchMergeKey=devicePath

            +patchStrategy=merge

            +optional'
          items:
            $ref: '#/components/schemas/VolumeDevice'
          type: array
        volumeMounts:
          description: 'Pod volumes to mount into the container''s filesystem.

            Cannot be updated.

            +optional

            +patchMergeKey=mountPath

            +patchStrategy=merge'
          items:
            $ref: '#/components/schemas/VolumeMount'
          type: array
        workingDir:
          description: 'Container''s working directory.

            If not specified, the container runtime''s default will be used, which

            might be configured in the container image.

            Cannot be updated.

            +optional'
          type: string
      title: A single application container that you want to run within a pod.
      type: object
    PodSchedulingGate:
      properties:
        name:
          description: 'Name of the scheduling gate.

            Each scheduling gate must have a unique name field.'
          type: string
      title: PodSchedulingGate is associated to a Pod to guard its scheduling.
      type: object
    GitRepoVolumeSource:
      description: 'DEPRECATED: GitRepo is deprecated. To provision a container with a git repo, mount an

        EmptyDir into an InitContainer that clones the repo using git, then mount the EmptyDir

        into the Pod''s container.'
      properties:
        directory:
          description: 'directory is the target directory name.

            Must not contain or start with ''..''.  If ''.'' is supplied, the volume directory will be the

            git repository.  Otherwise, if specified, the volume will contain the git repository in

            the subdirectory with the given name.

            +optional'
          type: string
        repository:
          description: repository is the URL
          type: string
        revision:
          description: 'revision is the commit hash for the specified revision.

            +optional'
          type: string
      title: 'Represents a volume that is populated with the contents of a git repository.

        Git repo volumes do not support ownership management.

        Git repo volumes support SELinux relabeling.'
      type: object
    CSIVolumeSource:
      description: Represents a source location of a volume to mount, managed by an external CSI driver
      properties:
        driver:
          description: 'driver is the name of the CSI driver that handles this volume.

            Consult with your admin for the correct name as registered in the cluster.'
          type: string
        fsType:
          description: 'fsType to mount. Ex. "ext4", "xfs", "ntfs".

            If not provided, the empty value is passed to the associated CSI driver

            which will determine the default filesystem to apply.

            +optional'
          type: string
        nodePublishSecretRef:
          $ref: '#/components/schemas/LocalObjectReference'
        readOnly:
          description: 'readOnly specifies a read-only configuration for the volume.

            Defaults to false (read/write).

            +optional'
          type: boolean
        volumeAttributes:
          additionalProperties:
            type: string
          description: 'volumeAttributes stores driver-specific properties that are passed to the CSI

            driver. Consult your driver''s documentation for supported values.

            +optional'
          type: object
      type: object
    Affinity:
      properties:
        nodeAffinity:
          $ref: '#/components/schemas/NodeAffinity'
        podAffinity:
          $ref: '#/components/schemas/PodAffinity'
        podAntiAffinity:
          $ref: '#/components/schemas/PodAntiAffinity'
      title: Affinity is a group of affinity scheduling rules.
      type: object
    PersistentVolumeAccessMode:
      description: +enum
      type: string
    MountPropagationMode:
      description: +enum
      title: MountPropagationMode describes mount propagation.
      type: string
    Probe:
      description: 'Probe describes a health check to be performed against a container to determine whether it is

        alive or ready to receive traffic.'
      properties:
        exec:
          $ref: '#/components/schemas/ExecAction'
        failureThreshold:
          description: 'Minimum consecutive failures for the probe to be considered failed after having succeeded.

            Defaults to 3. Minimum value is 1.

            +optional'
          format: int32
          type: integer
        grpc:
          $ref: '#/components/schemas/GRPCAction'
        httpGet:
          $ref: '#/components/schemas/HTTPGetAction'
        initialDelaySeconds:
          description: 'Number of seconds after the container has started before liveness probes are initiated.

            More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes

            +optional'
          format: int32
          type: integer
        periodSeconds:
          description: 'How often (in seconds) to perform the probe.

            Default to 10 seconds. Minimum value is 1.

            +optional'
          format: int32
          type: integer
        successThreshold:
          description: 'Minimum consecutive successes for the probe to be considered successful after having failed.

            Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1.

            +optional'
          format: int32
          type: integer
        tcpSocket:
          $ref: '#/components/schemas/TCPSocketAction'
        terminationGracePeriodSeconds:
          description: 'Optional duration in seconds the pod needs to terminate gracefully upon probe failure.

            The grace period is the duration in seconds after the processes running in the pod are sent

            a termination signal and the time when the processes are forcibly halted with a kill signal.

            Set this value longer than the expected cleanup time for your process.

            If this value is nil, the pod''s terminationGracePeriodSeconds will be used. Otherwise, this

            value overrides the value provided by the pod spec.

            Value must be non-negative integer. The value zero indicates stop immediately via

            the kill signal (no opportunity to shut down).

            This is a beta field and requires enabling ProbeTerminationGracePeriod feature gate.

            Minimum value is 1. spec.terminationGracePeriodSeconds is used if unset.

            +optional'
          format: int64
          type: integer
        timeoutSeconds:
          description: 'Number of seconds after which the probe times out.

            Defaults to 1 second. Minimum value is 1.

            More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes

            +optional'
          format: int32
          type: integer
      type: object
    KeyToPath:
      properties:
        key:
          description: key is the key to project.
          type: string
        mode:
          description: 'mode is Optional: mode bits used to set permissions on this file.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            If not specified, the volume defaultMode will be used.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
          format: int32
          type: integer
        path:
          description: 'path is the relative path of the file to map the key to.

            May not be an absolute path.

            May not contain the path element ''..''.

            May not start with the string ''..''.'
          type: string
      title: Maps a string key to a path within a volume.
      type: object
    LabelSelectorOperator:
      title: A label selector operator is the set of operators that can be used in a selector requirement.
      type: string
    ClusterTrustBundleProjection:
      description: 'ClusterTrustBundleProjection describes how to select a set of

        ClusterTrustBundle objects and project their contents into the pod

        filesystem.'
      properties:
        labelSelector:
          $ref: '#/components/schemas/LabelSelector'
        name:
          description: 'Select a single ClusterTrustBundle by object name.  Mutually-exclusive

            with signerName and labelSelector.

            +optional'
          type: string
        optional:
          description: 'If true, don''t block pod startup if the referenced ClusterTrustBundle(s)

            aren''t available.  If using name, then the named ClusterTrustBundle is

            allowed not to exist.  If using signerName, then the combination of

            signerName and labelSelector is allowed to match zero

            ClusterTrustBundles.

            +optional'
          type: boolean
        path:
          description: Relative path from the volume root to write the bundle.
          type: string
        signerName:
          description: 'Select all ClusterTrustBundles that match this signer name.

            Mutually-exclusive with name.  The contents of all selected

            ClusterTrustBundles will be unified and deduplicated.

            +optional'
          type: string
      type: object
    ClientIPConfig:
      properties:
        timeoutSeconds:
          description: 'timeoutSeconds specifies the seconds of ClientIP type session sticky time.

            The value must be >0 && <=86400(for 1 day) if ServiceAffinity == "ClientIP".

            Default value is 10800(for 3 hours).

            +optional'
          format: int32
          type: integer
      title: ClientIPConfig represents the configurations of Client IP based session affinity.
      type: object
    SeccompProfileType:
      description: +enum
      title: SeccompProfileType defines the supported seccomp profile types.
      type: string
    ConfigMapEnvSource:
      description: 'The contents of the target ConfigMap''s Data field will represent the

        key-value pairs as environment variables.'
      properties:
        name:
          description: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

            TODO: Add other useful fields. apiVersion, kind, uid?

            +optional'
          type: string
        optional:
          description: 'Specify whether the ConfigMap must be defined

            +optional'
          type: boolean
      title: 'ConfigMapEnvSource selects a ConfigMap to populate the environment

        variables with.'
      type: object
    Error:
      description: Error Error
      properties:
        code:
          description: Code
          format: int64
          type: integer
        message:
          description: Message
          type: string
        requestId:
          description: RequestId
          type: string
      type: object
    PodConditionType:
      description: PodConditionType is a valid value for PodCondition.Type
      type: string
    QuobyteVolumeSource:
      description: Quobyte volumes do not support ownership management or SELinux relabeling.
      properties:
        group:
          description: 'group to map volume access to

            Default is no group

            +optional'
          type: string
        readOnly:
          description: 'readOnly here will force the Quobyte volume to be mounted with read-only permissions.

            Defaults to false.

            +optional'
          type: boolean
        registry:
          description: 'registry represents a single or multiple Quobyte Registry services

            specified as a string as host:port pair (multiple entries are separated with commas)

            which acts as the central registry for volumes'
          type: string
        tenant:
          description: 'tenant owning the given Quobyte volume in the Backend

            Used with dynamically provisioned Quobyte volumes, value is set by the plugin

            +optional'
          type: string
        user:
          description: 'user to map volume access to

            Defaults to serivceaccount user

            +optional'
          type: string
        volume:
          description: volume is a string that references an already created Quobyte volume by name.
          type: string
      title: Represents a Quobyte mount that lasts the lifetime of a pod.
      type: object
    AWSElasticBlockStoreVolumeSource:
      description: 'An AWS EBS disk must exist before mounting to a container. The disk

        must also be in the same AWS zone as the kubelet. An AWS EBS disk

        can only be mounted as read/write once. AWS EBS volumes support

        ownership management and SELinux relabeling.'
      properties:
        fsType:
          description: 'fsType is the filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
          type: string
        partition:
          description: 'partition is the partition in the volume that you want to mount.

            If omitted, the default is to mount by volume name.

            Examples: For volume /dev/sda1, you specify the partition as "1".

            Similarly, the volume partition for /dev/sda is "0" (or you can leave the property empty).

            +optional'
          format: int32
          type: integer
        readOnly:
          description: 'readOnly value true will force the readOnly setting in VolumeMounts.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore

            +optional'
          type: boolean
        volumeID:
          description: 'volumeID is unique ID of the persistent disk resource in AWS (Amazon EBS volume).

            More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore'
          type: string
      title: Represents a Persistent Disk resource in AWS.
      type: object
    HTTPGetAction:
      properties:
        host:
          description: 'Host name to connect to, defaults to the pod IP. You probably want to set

            "Host" in httpHeaders instead.

            +optional'
          type: string
        httpHeaders:
          description: 'Custom headers to set in the request. HTTP allows repeated headers.

            +optional'
          items:
            $ref: '#/components/schemas/HTTPHeader'
          type: array
        path:
          description: 'Path to access on the HTTP server.

            +optional'
          type: string
        port:
          $ref: '#/components/schemas/IntOrString'
        scheme:
          $ref: '#/components/schemas/URIScheme'
      title: HTTPGetAction describes an action based on HTTP Get requests.
      type: object
    PodIP:
      properties:
        ip:
          description: IP is the IP address assigned to the pod
          type: string
      title: PodIP represents a single IP address allocated to the pod.
      type: object
    IPFamily:
      description: 'IPFamily represents the IP Family (IPv4 or IPv6). This type is used

        to express the family of an IP expressed by a type (e.g. service.spec.ipFamilies).

        +enum'
      type: string
    SessionAffinityConfig:
      properties:
        clientIP:
          $ref: '#/components/schemas/ClientIPConfig'
      title: SessionAffinityConfig represents the configurations of session affinity.
      type: object
    LabelSelector:
      description: 'A label selector is a label query over a set of resources. The result of matchLabels and

        matchExpressions are ANDed. An empty label selector matches all objects. A null

        label selector matches no objects.

        +structType=atomic'
      properties:
        matchExpressions:
          description: 'matchExpressions is a list of label selector requirements. The requirements are ANDed.

            +optional'
          items:
            $ref: '#/components/schemas/LabelSelectorRequirement'
          type: array
        matchLabels:
          additionalProperties:
            type: string
          description: 'matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels

            map is equivalent to an element of matchExpressions, whose key field is "key", the

            operator is "In", and the values array contains only "value". The requirements are ANDed.

            +optional'
          type: object
      type: object
    ContainerStatus:
      properties:
        allocatedResources:
          $ref: '#/components/schemas/ResourceList'
        containerID:
          description: 'ContainerID is the ID of the container in the format ''<type>://<container_id>''.

            Where type is a container runtime identifier, returned from Version call of CRI API

            (for example "containerd").

            +optional'
          type: string
        image:
          description: 'Image is the name of container image that the container is running.

            The container image may not match the image used in the PodSpec,

            as it may have been resolved by the runtime.

            More info: https://kubernetes.io/docs/concepts/containers/images.'
          type: string
        imageID:
          description: 'ImageID is the image ID of the container''s image. The image ID may not

            match the image ID of the image used in the PodSpec, as it may have been

            resolved by the runtime.'
          type: string
        lastState:
          $ref: '#/components/schemas/ContainerState'
        name:
          description: 'Name is a DNS_LABEL representing the unique name of the container.

            Each container in a pod must have a unique name across all container types.

            Cannot be updated.'
          type: string
        ready:
          description: 'Ready specifies whether the container is currently passing its readiness check.

            The value will change as readiness probes keep executing. If no readiness

            probes are specified, this field defaults to true once the container is

            fully started (see Started field).


            The value is typically used to determine whether a container is ready to

            accept traffic.'
          type: boolean
        resources:
          $ref: '#/components/schemas/ResourceRequirements'
        restartCount:
          description: 'RestartCount holds the number of times the container has been restarted.

            Kubelet makes an effort to always increment the value, but there

            are cases when the state may be lost due to node restarts and then the value

            may be reset to 0. The value is never negative.'
          format: int32
          type: integer
        started:
          description: 'Started indicates whether the container has finished its postStart lifecycle hook

            and passed its startup probe.

            Initialized as false, becomes true after startupProbe is considered

            successful. Resets to false when the container is restarted, or if kubelet

            loses state temporarily. In both cases, startup probes will run again.

            Is always true when no startupProbe is defined and container is running and

            has passed the postStart lifecycle hook. The null value must be treated the

            same as false.

            +optional'
          type: boolean
        state:
          $ref: '#/components/schemas/ContainerState'
      title: ContainerStatus contains details for the current status of this container.
      type: object
    UnsatisfiableConstraintAction:
      description: +enum
      type: string
    WindowsSecurityContextOptions:
      properties:
        gmsaCredentialSpec:
          description: 'GMSACredentialSpec is where the GMSA admission webhook

            (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the

            GMSA credential spec named by the GMSACredentialSpecName field.

            +optional'
          type: string
        gmsaCredentialSpecName:
          description: 'GMSACredentialSpecName is the name of the GMSA credential spec to use.

            +optional'
          type: string
        hostProcess:
          description: 'HostProcess determines if a container should be run as a ''Host Process'' container.

            All of a Pod''s containers must have the same effective HostProcess value

            (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).

            In addition, if HostProcess is true then HostNetwork must also be set to true.

            +optional'
          type: boolean
        runAsUserName:
          description: 'The UserName in Windows to run the entrypoint of the container process.

            Defaults to the user specified in image metadata if unspecified.

            May also be set in PodSecurityContext. If set in both SecurityContext and

            PodSecurityContext, the value specified in SecurityContext takes precedence.

            +optional'
          type: string
      title: WindowsSecurityContextOptions contain Windows-specific options and credentials.
      type: object
    EmptyDirVolumeSource:
      description: Empty directory volumes support ownership management and SELinux relabeling.
      properties:
        medium:
          $ref: '#/components/schemas/StorageMedium'
        sizeLimit:
          $ref: '#/components/schemas/Quantity'
      title: Represents an empty directory for a pod.
      type: object
    ProjectedVolumeSource:
      description: Represents a projected volume source
      properties:
        defaultMode:
          description: 'defaultMode are the mode bits used to set permissions on created files by default.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.

            Directories within the path are not affected by this setting.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
          format: int32
          type: integer
        sources:
          description: 'sources is the list of volume projections

            +optional'
          items:
            $ref: '#/components/schemas/VolumeProjection'
          type: array
      type: object
    ContainerPort:
      properties:
        containerPort:
          description: 'Number of port to expose on the pod''s IP address.

            This must be a valid port number, 0 < x < 65536.'
          format: int32
          type: integer
        hostIP:
          description: 'What host IP to bind the external port to.

            +optional'
          type: string
        hostPort:
          description: 'Number of port to expose on the host.

            If specified, this must be a valid port number, 0 < x < 65536.

            If HostNetwork is specified, this must match ContainerPort.

            Most containers do not need this.

            +optional'
          format: int32
          type: integer
        name:
          description: 'If specified, this must be an IANA_SVC_NAME and unique within the pod. Each

            named port in a pod must have a unique name. Name for the port that can be

            referred to by services.

            +optional'
          type: string
        protocol:
          $ref: '#/components/schemas/Protocol'
      title: ContainerPort represents a network port in a single container.
      type: object
    ObjectFieldSelector:
      description: +structType=atomic
      properties:
        apiVersion:
          description: 'Version of the schema the FieldPath is written in terms of, defaults to "v1".

            +optional'
          type: string
        fieldPath:
          description: Path of the field to select in the specified API version.
          type: string
      title: ObjectFieldSelector selects an APIVersioned field of an object.
      type: object
    DeploymentSpec:
      properties:
        minReadySeconds:
          description: 'Minimum number of seconds for which a newly created pod should be ready

            without any of its container crashing, for it to be considered available.

            Defaults to 0 (pod will be considered available as soon as it is ready)

            +optional'
          format: int32
          type: integer
        paused:
          description: 'Indicates that the deployment is paused.

            +optional'
          type: boolean
        progressDeadlineSeconds:
          description: 'The maximum time in seconds for a deployment to make progress before it

            is considered to be failed. The deployment controller will continue to

            process failed deployments and a condition with a ProgressDeadlineExceeded

            reason will be surfaced in the deployment status. Note that progress will

            not be estimated during the time a deployment is paused. Defaults to 600s.'
          format: int32
          type: integer
        replicas:
          description: 'Number of desired pods. This is a pointer to distinguish between explicit

            zero and not specified. Defaults to 1.

            +optional'
          format: int32
          type: integer
        revisionHistoryLimit:
          description: 'The number of old ReplicaSets to retain to allow rollback.

            This is a pointer to distinguish between explicit zero and not specified.

            Defaults to 10.

            +optional'
          format: int32
          type: integer
        selector:
          $ref: '#/components/schemas/LabelSelector'
        strategy:
          $ref: '#/components/schemas/DeploymentStrategy'
        template:
          $ref: '#/components/schemas/PodTemplateSpec'
      title: DeploymentSpec is the specification of the desired behavior of the Deployment.
      type: object
    ResourceName:
      title: ResourceName is the name identifying various resources in a ResourceList.
      type: string
    ISCSIVolumeSource:
      description: 'ISCSI volumes can only be mounted as read/write once.

        ISCSI volumes support ownership management and SELinux relabeling.'
      properties:
        chapAuthDiscovery:
          description: 'chapAuthDiscovery defines whether support iSCSI Discovery CHAP authentication

            +optional'
          type: boolean
        chapAuthSession:
          description: 'chapAuthSession defines whether support iSCSI Session CHAP authentication

            +optional'
          type: boolean
        fsType:
          description: 'fsType is the filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#iscsi

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
          type: string
        initiatorName:
          description: 'initiatorName is the custom iSCSI Initiator Name.

            If initiatorName is specified with iscsiInterface simultaneously, new iSCSI interface

            <target portal>:<volume name> will be created for the connection.

            +optional'
          type: string
        iqn:
          description: iqn is the target iSCSI Qualified Name.
          type: string
        iscsiInterface:
          description: 'iscsiInterface is the interface Name that uses an iSCSI transport.

            Defaults to ''default'' (tcp).

            +optional'
          type: string
        lun:
          description: lun represents iSCSI Target Lun number.
          format: int32
          type: integer
        portals:
          description: 'portals is the iSCSI Target Portal List. The portal is either an IP or ip_addr:port if the port

            is other than default (typically TCP ports 860 and 3260).

            +optional'
          items:
            type: string
          type: array
        readOnly:
          description: 'readOnly here will force the ReadOnly setting in VolumeMounts.

            Defaults to false.

            +optional'
          type: boolean
        secretRef:
          $ref: '#/components/schemas/LocalObjectReference'
        targetPortal:
          description: 'targetPortal is iSCSI Target Portal. The Portal is either an IP or ip_addr:port if the port

            is other than default (typically TCP ports 860 and 3260).'
          type: string
      title: Represents an ISCSI disk.
      type: object
    PodResourceClaim:
      description: 'It adds a name to it that uniquely identifies the ResourceClaim inside the Pod.

        Containers that need access to the ResourceClaim reference it with this name.'
      properties:
        name:
          description: 'Name uniquely identifies this resource claim inside the pod.

            This must be a DNS_LABEL.'
          type: string
        source:
          $ref: '#/components/schemas/ClaimSource'
      title: PodResourceClaim references exactly one ResourceClaim through a ClaimSource.
      type: object
    PodAffinity:
      properties:
        preferredDuringSchedulingIgnoredDuringExecution:
          description: 'The scheduler will prefer to schedule pods to nodes that satisfy

            the affinity expressions specified by this field, but it may choose

            a node that violates one or more of the expressions. The node that is

            most preferred is the one with the greatest sum of weights, i.e.

            for each node that meets all of the scheduling requirements (resource

            request, requiredDuringScheduling affinity expressions, etc.),

            compute a sum by iterating through the elements of this field and adding

            "weight" to the sum if the node has pods which matches the corresponding podAffinityTerm; the

            node(s) with the highest sum are the most preferred.

            +optional'
          items:
            $ref: '#/components/schemas/WeightedPodAffinityTerm'
          type: array
        requiredDuringSchedulingIgnoredDuringExecution:
          description: 'If the affinity requirements specified by this field are not met at

            scheduling time, the pod will not be scheduled onto the node.

            If the affinity requirements specified by this field cease to be met

            at some point during pod execution (e.g. due to a pod label update), the

            system may or may not try to eventually evict the pod from its node.

            When there are multiple elements, the lists of nodes corresponding to each

            podAffinityTerm are intersected, i.e. all terms must be satisfied.

            +optional'
          items:
            $ref: '#/components/schemas/PodAffinityTerm'
          type: array
      title: Pod affinity is a group of inter pod affinity scheduling rules.
      type: object
    ProcMountType:
      description: +enum
      type: string
    EnvFromSource:
      description: EnvFromSource represents the source of a set of ConfigMaps
      properties:
        configMapRef:
          $ref: '#/components/schemas/ConfigMapEnvSource'
        prefix:
          description: 'An optional identifier to prepend to each key in the ConfigMap. Must be a C_IDENTIFIER.

            +optional'
          type: string
        secretRef:
          $ref: '#/components/schemas/SecretEnvSource'
      type: object
    AzureDataDiskCachingMode:
      description: +enum
      type: string
    DNSPolicy:
      description: +enum
      title: DNSPolicy defines how a pod's DNS will be configured.
      type: string
    RBDVolumeSource:
      description: RBD volumes support ownership management and SELinux relabeling.
      properties:
        fsType:
          description: 'fsType is the filesystem type of the volume that you want to mount.

            Tip: Ensure that the filesystem type is supported by the host operating system.

            Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#rbd

            TODO: how do we prevent errors in the filesystem from compromising the machine

            +optional'
          type: string
        image:
          description: 'image is the rados image name.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it'
          type: string
        keyring:
          description: 'keyring is the path to key ring for RBDUser.

            Default is /etc/ceph/keyring.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional'
          type: string
        monitors:
          description: 'monitors is a collection of Ceph monitors.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it'
          items:
            type: string
          type: array
        pool:
          description: 'pool is the rados pool name.

            Default is rbd.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional'
          type: string
        readOnly:
          description: 'readOnly here will force the ReadOnly setting in VolumeMounts.

            Defaults to false.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional'
          type: boolean
        secretRef:
          $ref: '#/components/schemas/LocalObjectReference'
        user:
          description: 'user is the rados user name.

            Default is admin.

            More info: https://examples.k8s.io/volumes/rbd/README.md#how-to-use-it

            +optional'
          type: string
      title: Represents a Rados Block Device mount that lasts the lifetime of a pod.
      type: object
    ServiceStatus:
      properties:
        explainerFor:
          type: string
        grpcEndpoint:
          type: string
        httpEndpoint:
          type: string
        svcName:
          type: string
      type: object
    Pod:
      description: 'Pod is a collection of containers that can run on a host. This resource is created

        by clients and scheduled onto hosts.'
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations is an unstructured key value map stored with a resource that may be

            set by external tools to store and retrieve arbitrary metadata. They are not

            queryable and should be preserved when modifying objects.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

            +optional'
          type: object
        apiVersion:
          description: 'APIVersion defines the versioned schema of this representation of an object.

            Servers should convert recognized schemas to the latest internal value, and

            may reject unrecognized values.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources

            +optional'
          type: string
        creationTimestamp:
          description: 'CreationTimestamp is a timestamp representing the server time when this object was

            created. It is not guaranteed to be set in happens-before order across separate operations.

            Clients may not set this value. It is represented in RFC3339 form and is in UTC.


            Populated by the system.

            Read-only.

            Null for lists.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

            +optional'
          type: string
        deletionGracePeriodSeconds:
          description: 'Number of seconds allowed for this object to gracefully terminate before

            it will be removed from the system. Only set when deletionTimestamp is also set.

            May only be shortened.

            Read-only.

            +optional'
          format: int64
          type: integer
        deletionTimestamp:
          description: 'DeletionTimestamp is RFC 3339 date and time at which this resource will be deleted. This

            field is set by the server when a graceful deletion is requested by the user, and is not

            directly settable by a client. The resource is expected to be deleted (no longer visible

            from resource lists, and not reachable by name) after the time in this field, once the

            finalizers list is empty. As long as the finalizers list contains items, deletion is blocked.

            Once the deletionTimestamp is set, this value may not be unset or be set further into the

            future, although it may be shortened or the resource may be deleted prior to this time.

            For example, a user may request that a pod is deleted in 30 seconds. The Kubelet will react

            by sending a graceful termination signal to the containers in the pod. After that 30 seconds,

            the Kubelet will send a hard termination signal (SIGKILL) to the container and after cleanup,

            remove the pod from the API. In the presence of network partitions, this object may still

            exist after this timestamp, until an administrator or automated process can determine the

            resource is fully terminated.

            If not set, graceful deletion of the object has not been requested.


            Populated by the system when a graceful deletion is requested.

            Read-only.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

            +optional'
          type: string
        finalizers:
          description: 'Must be empty before the object is deleted from the registry. Each entry

            is an identifier for the responsible component that will remove the entry

            from the list. If the deletionTimestamp of the object is non-nil, entries

            in this list can only be removed.

            Finalizers may be processed and removed in any order.  Order is NOT enforced

            because it introduces significant risk of stuck finalizers.

            finalizers is a shared field, any actor with permission can reorder it.

            If the finalizer list is processed in order, then this can lead to a situation

            in which the component responsible for the first finalizer in the list is

            waiting for a signal (field value, external system, or other) produced by a

            component responsible for a finalizer later in the list, resulting in a deadlock.

            Without enforced ordering finalizers are free to order amongst themselves and

            are not vulnerable to ordering changes in the list.

            +optional

            +patchStrategy=merge'
          items:
            type: string
          type: array
        generateName:
          description: 'GenerateName is an optional prefix, used by the server, to generate a unique

            name ONLY IF the Name field has not been provided.

            If this field is used, the name returned to the client will be different

            than the name passed. This value will also be combined with a unique suffix.

            The provided value has the same validation rules as the Name field,

            and may be truncated by the length of the suffix required to make the value

            unique on the server.


            If this field is specified and the generated name exists, the server will return a 409.


            Applied only if Name is not specified.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#idempotency

            +optional'
          type: string
        generation:
          description: 'A sequence number representing a specific generation of the desired state.

            Populated by the system. Read-only.

            +optional'
          format: int64
          type: integer
        kind:
          description: 'Kind is a string value representing the REST resource this object represents.

            Servers may infer this from the endpoint the client submits requests to.

            Cannot be updated.

            In CamelCase.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds

            +optional'
          type: string
        labels:
          additionalProperties:
            type: string
          description: 'Map of string keys and values that can be used to organize and categorize

            (scope and select) objects. May match selectors of replication controllers

            and services.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels

            +optional'
          type: object
        managedFields:
          description: 'ManagedFields maps workflow-id and version to the set of fields

            that are managed by that workflow. This is mostly for internal

            housekeeping, and users typically shouldn''t need to set or

            understand this field. A workflow can be the user''s name, a

            controller''s name, or the name of a specific apply path like

            "ci-cd". The set of fields is always in the version that the

            workflow used when modifying the object.


            +optional'
          items:
            $ref: '#/components/schemas/ManagedFieldsEntry'
          type: array
        name:
          description: 'Name must be unique within a namespace. Is required when creating resources, although

            some resources may allow a client to request the generation of an appropriate name

            automatically. Name is primarily intended for creation idempotence and configuration

            definition.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

            +optional'
          type: string
        namespace:
          description: 'Namespace defines the space within which each name must be unique. An empty namespace is

            equivalent to the "default" namespace, but "default" is the canonical representation.

            Not all objects are required to be scoped to a namespace - the value of this field for

            those objects will be empty.


            Must be a DNS_LABEL.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces

            +optional'
          type: string
        ownerReferences:
          description: 'List of objects depended by this object. If ALL objects in the list have

            been deleted, this object will be garbage collected. If this object is managed by a controller,

            then an entry in this list will point to this controller, with the controller field set to true.

            There cannot be more than one managing controller.

            +optional

            +patchMergeKey=uid

            +patchStrategy=merge'
          items:
            $ref: '#/components/schemas/OwnerReference'
          type: array
        resourceVersion:
          description: 'An opaque value that represents the internal version of this object that can

            be used by clients to determine when objects have changed. May be used for optimistic

            concurrency, change detection, and the watch operation on a resource or set of resources.

            Clients must treat these values as opaque and passed unmodified back to the server.

            They may only be valid for a particular resource or set of resources.


            Populated by the system.

            Read-only.

            Value must be treated as opaque by clients and .

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
          type: string
        selfLink:
          description: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
          type: string
        spec:
          $ref: '#/components/schemas/PodSpec'
        status:
          $ref: '#/components/schemas/PodStatus'
        uid:
          $ref: '#/components/schemas/UID'
      type: object
    SecretProjection:
      description: 'The contents of the target Secret''s Data field will be presented in a

        projected volume as files using the keys in the Data field as the file names.

        Note that this is identical to a secret volume source without the default

        mode.'
      properties:
        items:
          description: 'items if unspecified, each key-value pair in the Data field of the referenced

            Secret will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the Secret,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional'
          items:
            $ref: '#/components/schemas/KeyToPath'
          type: array
        name:
          description: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

            TODO: Add other useful fields. apiVersion, kind, uid?

            +optional'
          type: string
        optional:
          description: 'optional field specify whether the Secret or its key must be defined

            +optional'
          type: boolean
      title: Adapts a secret into a projected volume.
      type: object
    PodResourceClaimStatus:
      description: 'PodResourceClaimStatus is stored in the PodStatus for each PodResourceClaim

        which references a ResourceClaimTemplate. It stores the generated name for

        the corresponding ResourceClaim.'
      properties:
        name:
          description: 'Name uniquely identifies this resource claim inside the pod.

            This must match the name of an entry in pod.spec.resourceClaims,

            which implies that the string must be a DNS_LABEL.'
          type: string
        resourceClaimName:
          description: 'ResourceClaimName is the name of the ResourceClaim that was

            generated for the Pod in the namespace of the Pod. It this is

            unset, then generating a ResourceClaim was not necessary. The

            pod.spec.resourceClaims entry can be ignored in this case.


            +optional'
          type: string
      type: object
    ConfigMapKeySelector:
      description: +structType=atomic
      properties:
        key:
          description: The key to select.
          type: string
        name:
          description: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

            TODO: Add other useful fields. apiVersion, kind, uid?

            +optional'
          type: string
        optional:
          description: 'Specify whether the ConfigMap or its key must be defined

            +optional'
          type: boolean
      title: Selects a key from a ConfigMap.
      type: object
    TCPSocketAction:
      description: TCPSocketAction describes an action based on opening a socket
      properties:
        host:
          description: 'Optional: Host name to connect to, defaults to the pod IP.

            +optional'
          type: string
        port:
          $ref: '#/components/schemas/IntOrString'
      type: object
    SecretVolumeSource:
      description: 'The contents of the target Secret''s Data field will be presented in a volume

        as files using the keys in the Data field as the file names.

        Secret volumes support ownership management and SELinux relabeling.'
      properties:
        defaultMode:
          description: 'defaultMode is Optional: mode bits used to set permissions on created files by default.

            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.

            YAML accepts both octal and decimal values, JSON requires decimal values

            for mode bits. Defaults to 0644.

            Directories within the path are not affected by this setting.

            This might be in conflict with other options that affect the file

            mode, like fsGroup, and the result can be other mode bits set.

            +optional'
          format: int32
          type: integer
        items:
          description: 'items If unspecified, each key-value pair in the Data field of the referenced

            Secret will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the Secret,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional'
          items:
            $ref: '#/components/schemas/KeyToPath'
          type: array
        optional:
          description: 'optional field specify whether the Secret or its keys must be defined

            +optional'
          type: boolean
        secretName:
          description: 'secretName is the name of the secret in the pod''s namespace to use.

            More info: https://kubernetes.io/docs/concepts/storage/volumes#secret

            +optional'
          type: string
      title: Adapts a Secret into a volume.
      type: object
    ServiceList:
      properties:
        apiVersion:
          description: 'APIVersion defines the versioned schema of this representation of an object.

            Servers should convert recognized schemas to the latest internal value, and

            may reject unrecognized values.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources

            +optional'
          type: string
        continue:
          description: 'continue may be set if the user set a limit on the number of items returned, and indicates that

            the server has more data available. The value is opaque and may be used to issue another request

            to the endpoint that served this list to retrieve the next set of available objects. Continuing a

            consistent list may not be possible if the server configuration has changed or more than a few

            minutes have passed. The resourceVersion field returned when using this continue value will be

            identical to the value in the first response, unless you have received this token from an error

            message.'
          type: string
        items:
          description: List of services
          items:
            $ref: '#/components/schemas/Service'
          type: array
        kind:
          description: 'Kind is a string value representing the REST resource this object represents.

            Servers may infer this from the endpoint the client submits requests to.

            Cannot be updated.

            In CamelCase.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds

            +optional'
          type: string
        remainingItemCount:
          description: 'remainingItemCount is the number of subsequent items in the list which are not included in this

            list response. If the list request contained label or field selectors, then the number of

            remaining items is unknown and the field will be left unset and omitted during serialization.

            If the list is complete (either because it is not chunking or because this is the last chunk),

            then there are no more remaining items and this field will be left unset and omitted during

            serialization.

            Servers older than v1.15 do not set this field.

            The intended use of the remainingItemCount is *estimating* the size of a collection. Clients

            should not rely on the remainingItemCount to be set or to be exact.

            +optional'
          format: int64
          type: integer
        resourceVersion:
          description: 'String that identifies the server''s internal version of this object that

            can be used by clients to determine when objects have changed.

            Value must be treated as opaque by clients and passed unmodified back to the server.

            Populated by the system.

            Read-only.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
          type: string
        selfLink:
          description: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
          type: string
      title: ServiceList holds a list of services.
      type: object
    StorageOSVolumeSource:
      properties:
        fsType:
          description: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            +optional'
          type: string
        readOnly:
          description: 'readOnly defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
          type: boolean
        secretRef:
          $ref: '#/components/schemas/LocalObjectReference'
        volumeName:
          description: 'volumeName is the human-readable name of the StorageOS volume.  Volume

            names are only unique within a namespace.'
          type: string
        volumeNamespace:
          description: 'volumeNamespace specifies the scope of the volume within StorageOS.  If no

            namespace is specified then the Pod''s namespace will be used.  This allows the

            Kubernetes name scoping to be mirrored within StorageOS for tighter integration.

            Set VolumeName to any name to override the default behaviour.

            Set to "default" if you are not using namespaces within StorageOS.

            Namespaces that do not pre-exist within StorageOS will be created.

            +optional'
          type: string
      title: Represents a StorageOS persistent volume resource.
      type: object
    CephFSVolumeSource:
      description: 'Represents a Ceph Filesystem mount that lasts the lifetime of a pod

        Cephfs volumes do not support ownership management or SELinux relabeling.'
      properties:
        monitors:
          description: 'monitors is Required: Monitors is a collection of Ceph monitors

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it'
          items:
            type: string
          type: array
        path:
          description: 'path is Optional: Used as the mounted root, rather than the full Ceph tree, default is /

            +optional'
          type: string
        readOnly:
          description: 'readOnly is Optional: Defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +optional'
          type: boolean
        secretFile:
          description: 'secretFile is Optional: SecretFile is the path to key ring for User, default is /etc/ceph/user.secret

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +optional'
          type: string
        secretRef:
          $ref: '#/components/schemas/LocalObjectReference'
        user:
          description: 'user is optional: User is the rados user name, default is admin

            More info: https://examples.k8s.io/volumes/cephfs/README.md#how-to-use-it

            +optional'
          type: string
      type: object
    PodAffinityTerm:
      description: 'Defines a set of pods (namely those matching the labelSelector

        relative to the given namespace(s)) that this pod should be

        co-located (affinity) or not co-located (anti-affinity) with,

        where co-located is defined as running on a node whose value of

        the label with key <topologyKey> matches that of any node on which

        a pod of the set of pods is running'
      properties:
        labelSelector:
          $ref: '#/components/schemas/LabelSelector'
        matchLabelKeys:
          description: 'MatchLabelKeys is a set of pod label keys to select which pods will

            be taken into consideration. The keys are used to lookup values from the

            incoming pod labels, those key-value labels are merged with `LabelSelector` as `key in (value)`

            to select the group of existing pods which pods will be taken into consideration

            for the incoming pod''s pod (anti) affinity. Keys that don''t exist in the incoming

            pod labels will be ignored. The default value is empty.

            The same key is forbidden to exist in both MatchLabelKeys and LabelSelector.

            Also, MatchLabelKeys cannot be set when LabelSelector isn''t set.

            This is an alpha field and requires enabling MatchLabelKeysInPodAffinity feature gate.

            +listType=atomic

            +optional'
          items:
            type: string
          type: array
        mismatchLabelKeys:
          description: 'MismatchLabelKeys is a set of pod label keys to select which pods will

            be taken into consideration. The keys are used to lookup values from the

            incoming pod labels, those key-value labels are merged with `LabelSelector` as `key notin (value)`

            to select the group of existing pods which pods will be taken into consideration

            for the incoming pod''s pod (anti) affinity. Keys that don''t exist in the incoming

            pod labels will be ignored. The default value is empty.

            The same key is forbidden to exist in both MismatchLabelKeys and LabelSelector.

            Also, MismatchLabelKeys cannot be set when LabelSelector isn''t set.

            This is an alpha field and requires enabling MatchLabelKeysInPodAffinity feature gate.

            +listType=atomic

            +optional'
          items:
            type: string
          type: array
        namespaceSelector:
          $ref: '#/components/schemas/LabelSelector'
        namespaces:
          description: 'namespaces specifies a static list of namespace names that the term applies to.

            The term is applied to the union of the namespaces listed in this field

            and the ones selected by namespaceSelector.

            null or empty namespaces list and null namespaceSelector means "this pod''s namespace".

            +optional'
          items:
            type: string
          type: array
        topologyKey:
          description: 'This pod should be co-located (affinity) or not co-located (anti-affinity) with the pods matching

            the labelSelector in the specified namespaces, where co-located is defined as running on a node

            whose value of the label with key topologyKey matches that of any node on which any of the

            selected pods is running.

            Empty topologyKey is not allowed.'
          type: string
      type: object
    Lifecycle:
      description: 'Lifecycle describes actions that the management system should take in response to container lifecycle

        events. For the PostStart and PreStop lifecycle handlers, management of the container blocks

        until the action is complete, unless the container process fails, in which case the handler is aborted.'
      properties:
        postStart:
          $ref: '#/components/schemas/LifecycleHandler'
        preStop:
          $ref: '#/components/schemas/LifecycleHandler'
      type: object
    PodPhase:
      description: +enum
      title: PodPhase is a label for the condition of a pod at the current time.
      type: string
    NodeAffinity:
      properties:
        preferredDuringSchedulingIgnoredDuringExecution:
          description: 'The scheduler will prefer to schedule pods to nodes that satisfy

            the affinity expressions specified by this field, but it may choose

            a node that violates one or more of the expressions. The node that is

            most preferred is the one with the greatest sum of weights, i.e.

            for each node that meets all of the scheduling requirements (resource

            request, requiredDuringScheduling affinity expressions, etc.),

            compute a sum by iterating through the elements of this field and adding

            "weight" to the sum if the node matches the corresponding matchExpressions; the

            node(s) with the highest sum are the most preferred.

            +optional'
          items:
            $ref: '#/components/schemas/PreferredSchedulingTerm'
          type: array
        requiredDuringSchedulingIgnoredDuringExecution:
          $ref: '#/components/schemas/NodeSelector'
      title: Node affinity is a group of node affinity scheduling rules.
      type: object
    PodAntiAffinity:
      properties:
        preferredDuringSchedulingIgnoredDuringExecution:
          description: 'The scheduler will prefer to schedule pods to nodes that satisfy

            the anti-affinity expressions specified by this field, but it may choose

            a node that violates one or more of the expressions. The node that is

            most preferred is the one with the greatest sum of weights, i.e.

            for each node that meets all of the scheduling requirements (resource

            request, requiredDuringScheduling anti-affinity expressions, etc.),

            compute a sum by iterating through the elements of this field and adding

            "weight" to the sum if the node has pods which matches the corresponding podAffinityTerm; the

            node(s) with the highest sum are the most preferred.

            +optional'
          items:
            $ref: '#/components/schemas/WeightedPodAffinityTerm'
          type: array
        requiredDuringSchedulingIgnoredDuringExecution:
          description: 'If the anti-affinity requirements specified by this field are not met at

            scheduling time, the pod will not be scheduled onto the node.

            If the anti-affinity requirements specified by this field cease to be met

            at some point during pod execution (e.g. due to a pod label update), the

            system may or may not try to eventually evict the pod from its node.

            When there are multiple elements, the lists of nodes corresponding to each

            podAffinityTerm are intersected, i.e. all terms must be satisfied.

            +optional'
          items:
            $ref: '#/components/schemas/PodAffinityTerm'
          type: array
      title: Pod anti affinity is a group of inter pod anti affinity scheduling rules.
      type: object
    WeightedPodAffinityTerm:
      description: The weights of all of the matched WeightedPodAffinityTerm fields are added per-node to find the most preferred node(s)
      properties:
        podAffinityTerm:
          $ref: '#/components/schemas/PodAffinityTerm'
        weight:
          description: 'weight associated with matching the corresponding podAffinityTerm,

            in the range 1-100.'
          format: int32
          type: integer
      type: object
    ExecAction:
      properties:
        command:
          description: 'Command is the command line to execute inside the container, the working directory for the

            command  is root (''/'') in the container''s filesystem. The command is simply exec''d, it is

            not run inside a shell, so traditional shell instructions (''|'', etc) won''t work. To use

            a shell, you need to explicitly call out to that shell.

            Exit status of 0 is treated as live/healthy and non-zero is unhealthy.

            +optional'
          items:
            type: string
          type: array
      title: ExecAction describes a "run in container" action.
      type: object
    SleepAction:
      properties:
        seconds:
          description: Seconds is the number of seconds to sleep.
          format: int64
          type: integer
      title: SleepAction describes a "sleep" action.
      type: object
    ManagedFieldsOperationType:
      title: ManagedFieldsOperationType is the type of operation which lead to a ManagedFieldsEntry being created.
      type: string
    OSName:
      title: OSName is the set of OS'es that can be used in OS.
      type: string
    Toleration:
      description: 'The pod this Toleration is attached to tolerates any taint that matches

        the triple <key,value,effect> using the matching operator <operator>.'
      properties:
        effect:
          $ref: '#/components/schemas/TaintEffect'
        key:
          description: 'Key is the taint key that the toleration applies to. Empty means match all taint keys.

            If the key is empty, operator must be Exists; this combination means to match all values and all keys.

            +optional'
          type: string
        operator:
          $ref: '#/components/schemas/TolerationOperator'
        tolerationSeconds:
          description: 'TolerationSeconds represents the period of time the toleration (which must be

            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,

            it is not set, which means tolerate the taint forever (do not evict). Zero and

            negative values will be treated as 0 (evict immediately) by the system.

            +optional'
          format: int64
          type: integer
        value:
          description: 'Value is the taint value the toleration matches to.

            If the operator is Exists, the value should be empty, otherwise just a regular string.

            +optional'
          type: string
      type: object
    VolumeMount:
      properties:
        mountPath:
          description: 'Path within the container at which the volume should be mounted.  Must

            not contain '':''.'
          type: string
        mountPropagation:
          $ref: '#/components/schemas/MountPropagationMode'
        name:
          description: This must match the Name of a Volume.
          type: string
        readOnly:
          description: 'Mounted read-only if true, read-write otherwise (false or unspecified).

            Defaults to false.

            +optional'
          type: boolean
        subPath:
          description: 'Path within the volume from which the container''s volume should be mounted.

            Defaults to "" (volume''s root).

            +optional'
          type: string
        subPathExpr:
          description: 'Expanded path within the volume from which the container''s volume should be mounted.

            Behaves similarly to SubPath but environment variable references $(VAR_NAME) are expanded using the container''s environment.

            Defaults to "" (volume''s root).

            SubPathExpr and SubPath are mutually exclusive.

            +optional'
          type: string
      title: VolumeMount describes a mounting of a Volume within a container.
      type: object
    ContainerResizePolicy:
      properties:
        resourceName:
          $ref: '#/components/schemas/ResourceName'
        restartPolicy:
          $ref: '#/components/schemas/ResourceResizeRestartPolicy'
      title: ContainerResizePolicy represents resource resize policy for the container.
      type: object
    PersistentVolumeClaimTemplate:
      description: 'PersistentVolumeClaimTemplate is used to produce

        PersistentVolumeClaim objects as part of an EphemeralVolumeSource.'
      properties:
        annotations:
          additionalProperties:
            type: string
          description: 'Annotations is an unstructured key value map stored with a resource that may be

            set by external tools to store and retrieve arbitrary metadata. They are not

            queryable and should be preserved when modifying objects.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

            +optional'
          type: object
        creationTimestamp:
          description: 'CreationTimestamp is a timestamp representing the server time when this object was

            created. It is not guaranteed to be set in happens-before order across separate operations.

            Clients may not set this value. It is represented in RFC3339 form and is in UTC.


            Populated by the system.

            Read-only.

            Null for lists.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

            +optional'
          type: string
        deletionGracePeriodSeconds:
          description: 'Number of seconds allowed for this object to gracefully terminate before

            it will be removed from the system. Only set when deletionTimestamp is also set.

            May only be shortened.

            Read-only.

            +optional'
          format: int64
          type: integer
        deletionTimestamp:
          description: 'DeletionTimestamp is RFC 3339 date and time at which this resource will be deleted. This

            field is set by the server when a graceful deletion is requested by the user, and is not

            directly settable by a client. The resource is expected to be deleted (no longer visible

            from resource lists, and not reachable by name) after the time in this field, once the

            finalizers list is empty. As long as the finalizers list contains items, deletion is blocked.

            Once the deletionTimestamp is set, this value may not be unset or be set further into the

            future, although it may be shortened or the resource may be deleted prior to this time.

            For example, a user may request that a pod is deleted in 30 seconds. The Kubelet will react

            by sending a graceful termination signal to the containers in the pod. After that 30 seconds,

            the Kubelet will send a hard termination signal (SIGKILL) to the container and after cleanup,

            remove the pod from the API. In the presence of network partitions, this object may still

            exist after this timestamp, until an administrator or automated process can determine the

            resource is fully terminated.

            If not set, graceful deletion of the object has not been requested.


            Populated by the system when a graceful deletion is requested.

            Read-only.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

            +optional'
          type: string
        finalizers:
          description: 'Must be empty before the object is deleted from the registry. Each entry

            is an identifier for the responsible component that will remove the entry

            from the list. If the deletionTimestamp of the object is non-nil, entries

            in this list can only be removed.

            Finalizers may be processed and removed in any order.  Order is NOT enforced

            because it introduces significant risk of stuck finalizers.

            finalizers is a shared field, any actor with permission can reorder it.

            If the finalizer list is processed in order, then this can lead to a situation

            in which the component responsible for the first finalizer in the list is

            waiting for a signal (field value, external system, or other) produced by a

            component responsible for a finalizer later in the list, resulting in a deadlock.

            Without enforced ordering finalizers are free to order amongst themselves and

            are not vulnerable to ordering changes in the list.

            +optional

            +patchStrategy=merge'
          items:
            type: string
          type: array
        generateName:
          description: 'GenerateName is an optional prefix, used by the server, to generate a unique

            name ONLY IF the Name field has not been provided.

            If this field is used, the name returned to the client will be different

            than the name passed. This value will also be combined with a unique suffix.

            The provided value has the same validation rules as the Name field,

            and may be truncated by the length of the suffix required to make the value

            unique on the server.


            If this field is specified and the generated name exists, the server will return a 409.


            Applied only if Name is not specified.

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#idempotency

            +optional'
          type: string
        generation:
          description: 'A sequence number representing a specific generation of the desired state.

            Populated by the system. Read-only.

            +optional'
          format: int64
          type: integer
        labels:
          additionalProperties:
            type: string
          description: 'Map of string keys and values that can be used to organize and categorize

            (scope and select) objects. May match selectors of replication controllers

            and services.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels

            +optional'
          type: object
        managedFields:
          description: 'ManagedFields maps workflow-id and version to the set of fields

            that are managed by that workflow. This is mostly for internal

            housekeeping, and users typically shouldn''t need to set or

            understand this field. A workflow can be the user''s name, a

            controller''s name, or the name of a specific apply path like

            "ci-cd". The set of fields is always in the version that the

            workflow used when modifying the object.


            +optional'
          items:
            $ref: '#/components/schemas/ManagedFieldsEntry'
          type: array
        name:
          description: 'Name must be unique within a namespace. Is required when creating resources, although

            some resources may allow a client to request the generation of an appropriate name

            automatically. Name is primarily intended for creation idempotence and configuration

            definition.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names#names

            +optional'
          type: string
        namespace:
          description: 'Namespace defines the space within which each name must be unique. An empty namespace is

            equivalent to the "default" namespace, but "default" is the canonical representation.

            Not all objects are required to be scoped to a namespace - the value of this field for

            those objects will be empty.


            Must be a DNS_LABEL.

            Cannot be updated.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces

            +optional'
          type: string
        ownerReferences:
          description: 'List of objects depended by this object. If ALL objects in the list have

            been deleted, this object will be garbage collected. If this object is managed by a controller,

            then an entry in this list will point to this controller, with the controller field set to true.

            There cannot be more than one managing controller.

            +optional

            +patchMergeKey=uid

            +patchStrategy=merge'
          items:
            $ref: '#/components/schemas/OwnerReference'
          type: array
        resourceVersion:
          description: 'An opaque value that represents the internal version of this object that can

            be used by clients to determine when objects have changed. May be used for optimistic

            concurrency, change detection, and the watch operation on a resource or set of resources.

            Clients must treat these values as opaque and passed unmodified back to the server.

            They may only be valid for a particular resource or set of resources.


            Populated by the system.

            Read-only.

            Value must be treated as opaque by clients and .

            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency

            +optional'
          type: string
        selfLink:
          description: 'Deprecated: selfLink is a legacy read-only field that is no longer populated by the system.

            +optional'
          type: string
        spec:
          $ref: '#/components/schemas/PersistentVolumeClaimSpec'
        uid:
          $ref: '#/components/schemas/UID'
      type: object
    PodOS:
      properties:
        name:
          $ref: '#/components/schemas/OSName'
      title: PodOS defines the OS parameters of a pod.
