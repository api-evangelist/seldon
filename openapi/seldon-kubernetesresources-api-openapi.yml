        name:
          description: Required.
          type: string
        value:
          description: +optional
          type: string
      title: PodDNSConfigOption defines DNS resolver options of a pod.
      type: object
    RestartPolicy:
      description: 'Only one of the following restart policies may be specified.

        If none of the following policies is specified, the default one

        is RestartPolicyAlways.

        +enum'
      title: RestartPolicy describes how the container should be restarted.
      type: string
    ConfigMapProjection:
      description: 'The contents of the target ConfigMap''s Data field will be presented in a

        projected volume as files using the keys in the Data field as the file names,

        unless the items element is populated with specific mappings of keys to paths.

        Note that this is identical to a configmap volume source without the default

        mode.'
      properties:
        items:
          description: 'items if unspecified, each key-value pair in the Data field of the referenced

            ConfigMap will be projected into the volume as a file whose name is the

            key and content is the value. If specified, the listed keys will be

            projected into the specified paths, and unlisted keys will not be

            present. If a key is specified which is not present in the ConfigMap,

            the volume setup will error unless it is marked optional. Paths must be

            relative and may not contain the ''..'' path or start with ''..''.

            +optional'
          items:
            $ref: '#/components/schemas/KeyToPath'
          type: array
        name:
          description: 'Name of the referent.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

            TODO: Add other useful fields. apiVersion, kind, uid?

            +optional'
          type: string
        optional:
          description: 'optional specify whether the ConfigMap or its keys must be defined

            +optional'
          type: boolean
      title: Adapts a ConfigMap into a projected volume.
      type: object
    VolumeResourceRequirements:
      properties:
        limits:
          $ref: '#/components/schemas/ResourceList'
        requests:
          $ref: '#/components/schemas/ResourceList'
      title: VolumeResourceRequirements describes the storage resource requirements for a volume.
      type: object
    PreferredSchedulingTerm:
      description: 'An empty preferred scheduling term matches all objects with implicit weight 0

        (i.e. it''s a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).'
      properties:
        preference:
          $ref: '#/components/schemas/NodeSelectorTerm'
        weight:
          description: Weight associated with matching the corresponding nodeSelectorTerm, in the range 1-100.
          format: int32
          type: integer
      type: object
    ServiceExternalTrafficPolicy:
      description: 'ServiceExternalTrafficPolicy describes how nodes distribute service traffic they

        receive on one of the Service''s "externally-facing" addresses (NodePorts, ExternalIPs,

        and LoadBalancer IPs.

        +enum'
      type: string
    DownwardAPIProjection:
      description: 'Note that this is identical to a downwardAPI volume source without the default

        mode.'
      properties:
        items:
          description: 'Items is a list of DownwardAPIVolume file

            +optional'
          items:
            $ref: '#/components/schemas/DownwardAPIVolumeFile'
          type: array
      title: Represents downward API info for projecting into a projected volume.
      type: object
    Sysctl:
      description: Sysctl defines a kernel parameter to be set
      properties:
        name:
          description: Name of a property to set
          type: string
        value:
          description: Value of a property to set
          type: string
      type: object
    ServiceInternalTrafficPolicy:
      description: 'ServiceInternalTrafficPolicy describes how nodes distribute service traffic they

        receive on the ClusterIP.

        +enum'
      type: string
    FieldsV1:
      description: 'Each key is either a ''.'' representing the field itself, and will always map to an empty set,

        or a string representing a sub-field or item. The string will follow one of these four formats:

        ''f:<name>'', where <name> is the name of a field in a struct, or key in a map

        ''v:<value>'', where <value> is the exact json formatted value of a list item

        ''i:<index>'', where <index> is position of a item in a list

        ''k:<keys>'', where <keys> is a map of  a list item''s key fields to their unique values

        If a key maps to an empty Fields value, the field that key represents is part of the set.


        The exact format is defined in sigs.k8s.io/structured-merge-diff

        +protobuf.options.(gogoproto.goproto_stringer)=false'
      title: FieldsV1 stores a set of fields in a data structure like a Trie, in JSON format.
      type: object
    ResourceClaim:
      properties:
        name:
          description: 'Name must match the name of one entry in pod.spec.resourceClaims of

            the Pod where this field is used. It makes that resource available

            inside a container.'
          type: string
      title: ResourceClaim references one entry in PodSpec.ResourceClaims.
      type: object
    HTTPHeader:
      description: HTTPHeader describes a custom header to be used in HTTP probes
      properties:
        name:
          description: 'The header field name.

            This will be canonicalized upon output, so case-variant names will be understood as the same header.'
          type: string
        value:
          description: The header field value
          type: string
      type: object
    EnvVarSource:
      properties:
        configMapKeyRef:
          $ref: '#/components/schemas/ConfigMapKeySelector'
        fieldRef:
          $ref: '#/components/schemas/ObjectFieldSelector'
        resourceFieldRef:
          $ref: '#/components/schemas/ResourceFieldSelector'
        secretKeyRef:
          $ref: '#/components/schemas/SecretKeySelector'
      title: EnvVarSource represents a source for the value of an EnvVar.
      type: object
    ContainerStateWaiting:
      properties:
        message:
          description: 'Message regarding why the container is not yet running.

            +optional'
          type: string
        reason:
          description: '(brief) reason the container is not yet running.

            +optional'
          type: string
      title: ContainerStateWaiting is a waiting state of a container.
      type: object
    UID:
      description: 'UID is a type that holds unique ID values, including UUIDs.  Because we

        don''t ONLY use UUIDs, this is an alias to string.  Being a type captures

        intent and helps make sure that UIDs and names do not get conflated.'
      type: string
    TerminationMessagePolicy:
      description: +enum
      title: TerminationMessagePolicy describes how termination messages are retrieved from a container.
      type: string
    NodeSelector:
      description: 'A node selector represents the union of the results of one or more label queries

        over a set of nodes; that is, it represents the OR of the selectors represented

        by the node selector terms.

        +structType=atomic'
      properties:
        nodeSelectorTerms:
          description: Required. A list of node selector terms. The terms are ORed.
          items:
            $ref: '#/components/schemas/NodeSelectorTerm'
          type: array
      type: object
    AzureFileVolumeSource:
      properties:
        readOnly:
          description: 'readOnly defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
          type: boolean
        secretName:
          description: secretName is the  name of secret that contains Azure Storage Account Name and Key
          type: string
        shareName:
          description: shareName is the azure share Name
          type: string
      title: AzureFile represents an Azure File Service mount on the host and bind mount to the pod.
      type: object
    VolumeDevice:
      properties:
        devicePath:
          description: devicePath is the path inside of the container that the device will be mapped to.
          type: string
        name:
          description: name must match the name of a persistentVolumeClaim in the pod
          type: string
      title: volumeDevice describes a mapping of a raw block device within a container.
      type: object
    TopologySpreadConstraint:
      properties:
        labelSelector:
          $ref: '#/components/schemas/LabelSelector'
        matchLabelKeys:
          description: 'MatchLabelKeys is a set of pod label keys to select the pods over which

            spreading will be calculated. The keys are used to lookup values from the

            incoming pod labels, those key-value labels are ANDed with labelSelector

            to select the group of existing pods over which spreading will be calculated

            for the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector.

            MatchLabelKeys cannot be set when LabelSelector isn''t set.

            Keys that don''t exist in the incoming pod labels will

            be ignored. A null or empty list means only match against labelSelector.


            This is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).

            +listType=atomic

            +optional'
          items:
            type: string
          type: array
        maxSkew:
          description: "MaxSkew describes the degree to which pods may be unevenly distributed.\nWhen `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference\nbetween the number of matching pods in the target topology and the global minimum.\nThe global minimum is the minimum number of matching pods in an eligible domain\nor zero if the number of eligible domains is less than MinDomains.\nFor example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same\nlabelSelector spread as 2/2/1:\nIn this case, the global minimum is 1.\n+-------+-------+-------+\n zone1 | zone2 | zone3 |\n+-------+-------+-------+\n  P P  |  P P  |   P   |\n+-------+-------+-------+\nif MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2;\nscheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2)\nviolate MaxSkew(1).\nif MaxSkew is 2, incoming pod can be scheduled onto any zone.\nWhen `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence\nto topologies that satisfy it.\nIt's a required field. Default value is 1 and 0 is not allowed."
          format: int32
          type: integer
        minDomains:
          description: "MinDomains indicates a minimum number of eligible domains.\nWhen the number of eligible domains with matching topology keys is less than minDomains,\nPod Topology Spread treats \"global minimum\" as 0, and then the calculation of Skew is performed.\nAnd when the number of eligible domains with matching topology keys equals or greater than minDomains,\nthis value has no effect on scheduling.\nAs a result, when the number of eligible domains is less than minDomains,\nscheduler won't schedule more than maxSkew Pods to those domains.\nIf value is nil, the constraint behaves as if MinDomains is equal to 1.\nValid values are integers greater than 0.\nWhen value is not nil, WhenUnsatisfiable must be DoNotSchedule.\n\nFor example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same\nlabelSelector spread as 2/2/2:\n+-------+-------+-------+\n zone1 | zone2 | zone3 |\n+-------+-------+-------+\n  P P  |  P P  |  P P  |\n+-------+-------+-------+\nThe number of domains is less than 5(MinDomains), so \"global minimum\" is treated as 0.\nIn this situation, new pod with the same labelSelector cannot be scheduled,\nbecause computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones,\nit will violate MaxSkew.\n\nThis is a beta field and requires the MinDomainsInPodTopologySpread feature gate to be enabled (enabled by default).\n+optional"
          format: int32
          type: integer
        nodeAffinityPolicy:
          $ref: '#/components/schemas/NodeInclusionPolicy'
        nodeTaintsPolicy:
          $ref: '#/components/schemas/NodeInclusionPolicy'
        topologyKey:
          description: 'TopologyKey is the key of node labels. Nodes that have a label with this key

            and identical values are considered to be in the same topology.

            We consider each <key, value> as a "bucket", and try to put balanced number

            of pods into each bucket.

            We define a domain as a particular instance of a topology.

            Also, we define an eligible domain as a domain whose nodes meet the requirements of

            nodeAffinityPolicy and nodeTaintsPolicy.

            e.g. If TopologyKey is "kubernetes.io/hostname", each Node is a domain of that topology.

            And, if TopologyKey is "topology.kubernetes.io/zone", each zone is a domain of that topology.

            It''s a required field.'
          type: string
        whenUnsatisfiable:
          $ref: '#/components/schemas/UnsatisfiableConstraintAction'
      title: TopologySpreadConstraint specifies how to spread matching pods among the given topology.
      type: object
    FlexVolumeSource:
      description: 'FlexVolume represents a generic volume resource that is

        provisioned/attached using an exec based plugin.'
      properties:
        driver:
          description: driver is the name of the driver to use for this volume.
          type: string
        fsType:
          description: 'fsType is the filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". The default filesystem depends on FlexVolume script.

            +optional'
          type: string
        options:
          additionalProperties:
            type: string
          description: 'options is Optional: this field holds extra command options if any.

            +optional'
          type: object
        readOnly:
          description: 'readOnly is Optional: defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
          type: boolean
        secretRef:
          $ref: '#/components/schemas/LocalObjectReference'
      type: object
    DeploymentStrategyType:
      description: +enum
      type: string
    VsphereVirtualDiskVolumeSource:
      properties:
        fsType:
          description: 'fsType is filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            +optional'
          type: string
        storagePolicyID:
          description: 'storagePolicyID is the storage Policy Based Management (SPBM) profile ID associated with the StoragePolicyName.

            +optional'
          type: string
        storagePolicyName:
          description: 'storagePolicyName is the storage Policy Based Management (SPBM) profile name.

            +optional'
          type: string
        volumePath:
          description: volumePath is the path that identifies vSphere volume vmdk
          type: string
      title: Represents a vSphere volume resource.
      type: object
    HostIP:
      properties:
        ip:
          description: IP is the IP address assigned to the host
          type: string
      title: HostIP represents a single IP address allocated to the host.
      type: object
    AzureDiskVolumeSource:
      properties:
        cachingMode:
          $ref: '#/components/schemas/AzureDataDiskCachingMode'
        diskName:
          description: diskName is the Name of the data disk in the blob storage
          type: string
        diskURI:
          description: diskURI is the URI of data disk in the blob storage
          type: string
        fsType:
          description: 'fsType is Filesystem type to mount.

            Must be a filesystem type supported by the host operating system.

            Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.

            +optional'
          type: string
        kind:
          $ref: '#/components/schemas/AzureDataDiskKind'
        readOnly:
          description: 'readOnly Defaults to false (read/write). ReadOnly here will force

            the ReadOnly setting in VolumeMounts.

            +optional'
          type: boolean
      title: AzureDisk represents an Azure Data Disk mount on the host and bind mount to the pod.
      type: object
